# Vendored third-party package: we enforce the project's critical
# concurrency-safety invariant (no `@unchecked Sendable`) via SwiftLint, but do
# not impose the full BrightDigit house style on upstream Sundell code.
only_rules:
  - no_unchecked_sendable
excluded:
  - .build
  - Package.swift
custom_rules:
  no_unchecked_sendable:
    name: "No Unchecked Sendable"
    regex: '@unchecked\s+Sendable'
    message: "Use proper Sendable conformance instead of @unchecked Sendable to maintain strict concurrency safety"
    severity: error
