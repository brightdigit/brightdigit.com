                              type: boolean
                              title: Auto-Footer
                              description: Automatically append Mailchimp's [default
                                footer](https://mailchimp.com/help/about-campaign-footers/)
                                to the campaign.
                            inline_css:
                              type: boolean
                              title: Inline CSS
                              description: Automatically inline the CSS included with
                                the campaign content.
                            auto_tweet:
                              type: boolean
