                        settings:
                          type: object
                          title: Campaign Settings
                          description: The settings for your campaign, including subject,
                            from name, reply-to address, and more.
                          properties:
                            subject_line:
                              type: string
                              title: Campaign Subject Line
                              description: The subject line for the campaign.
                            preview_text:
                              type: string
                              title: Campaign Preview Text
                              description: The preview text for the campaign.
                            title:
                              type: string
                              title: Campaign Title
                              description: The title of the campaign.
                            from_name:
                              type: string
                              title: From Name
                              description: The 'from' name on the campaign (not an
                                email address).
                            reply_to:
                              type: string
                              title: Reply To Address
                              description: The reply-to email address for the campaign.
                            use_conversation:
                              type: boolean
                              title: Conversation
                              description: Use Mailchimp Conversation feature to manage
                                out-of-office replies.
                            to_name:
                              type: string
                              title: To Name
                              description: The campaign's custom 'To' name. Typically
                                the first name [audience field](https://mailchimp.com/help/getting-started-with-merge-tags/).
                            folder_id:
                              type: string
                              title: Folder ID
                              description: If the campaign is listed in a folder,
                                the id for that folder.
                            authenticate:
                              type: boolean
                              title: Authentication
                              description: Whether Mailchimp [authenticated](https://mailchimp.com/help/about-email-authentication/)
                                the campaign. Defaults to `true`.
                            auto_footer:
                              type: boolean
                              title: Auto-Footer
                              description: Automatically append Mailchimp's [default
                                footer](https://mailchimp.com/help/about-campaign-footers/)
                                to the campaign.
                            inline_css:
                              type: boolean
                              title: Inline CSS
                              description: Automatically inline the CSS included with
                                the campaign content.
                            auto_tweet:
                              type: boolean
                              title: Auto-Tweet
                              description: Automatically tweet a link to the [campaign
                                archive](https://mailchimp.com/help/about-email-campaign-archives-and-pages/)
                                page when the campaign is sent.
                            auto_fb_post:
                              type: array
                              title: Auto Post to Facebook
                              description: An array of [Facebook](https://mailchimp.com/help/connect-or-disconnect-the-facebook-integration/)
                                page ids to auto-post to.
                              items:
                                type: string
                              minItems: 0
                              uniqueItems: false
                            fb_comments:
                              type: boolean
                              title: Facebook Comments
                              description: Allows Facebook comments on the campaign
                                (also force-enables the Campaign Archive toolbar).
                                Defaults to `true`.
                            timewarp:
                              type: boolean
                              title: Timewarp Send
                              description: Send this campaign using [Timewarp](https://mailchimp.com/help/use-timewarp/).
                              readOnly: true
                            template_id:
                              type: integer
                              title: Template ID
                              description: The id for the template used in this campaign.
                            drag_and_drop:
                              type: boolean
                              title: Drag And Drop Campaign
                              description: Whether the campaign uses the drag-and-drop
                                editor.
                              readOnly: true
                          minProperties: 0
                        variate_settings:
                          type: object
                          title: A/B Test Options
                          description: The settings specific to A/B test campaigns.
                          properties:
                            winning_combination_id:
                              type: string
                              title: Winning Combination ID
                              description: ID for the winning combination.
                              readOnly: true
                            winning_campaign_id:
                              type: string
                              title: Winning Campaign ID
                              description: ID of the campaign that was sent to the
                                remaining recipients based on the winning combination.
                              readOnly: true
                            winner_criteria:
                              type: string
                              enum:
                              - opens
                              - clicks
                              - manual
                              - total_revenue
                              title: Winning Criteria
                              description: The combination that performs the best.
                                This may be determined automatically by click rate,
                                open rate, or total revenue -- or you may choose manually
                                based on the reporting data you find the most valuable.
                                For Multivariate Campaigns testing send_time, winner_criteria
                                is ignored. For Multivariate Campaigns with 'manual'
                                as the winner_criteria, the winner must be chosen
                                in the Mailchimp web application.
                            wait_time:
                              type: integer
                              title: Wait Time
                              description: The number of minutes to wait before choosing
                                the winning campaign. The value of wait_time must
                                be greater than 0 and in whole hours, specified in
                                minutes.
                            test_size:
                              type: integer
                              title: Test Size
                              description: The percentage of recipients to send the
                                test combinations to, must be a value between 10 and
                                100.
                            subject_lines:
                              type: array
                              title: Subject Lines
                              description: The possible subject lines to test. If
                                no subject lines are provided, settings.subject_line
                                will be used.
                              items:
                                type: string
                              minItems: 0
                              uniqueItems: false
                            send_times:
                              type: array
                              title: Send Times
                              description: The possible send times to test. The times
                                provided should be in the format YYYY-MM-DD HH:MM:SS.
                                If send_times are provided to test, the test_size
                                will be set to 100% and winner_criteria will be ignored.
                              items:
                                type: string
                                format: date-time
                              minItems: 0
                              uniqueItems: false
                            from_names:
                              type: array
                              title: From Names
                              description: The possible from names. The number of
                                from_names provided must match the number of reply_to_addresses.
                                If no from_names are provided, settings.from_name
                                will be used.
                              items:
                                type: string
                              minItems: 0
                              uniqueItems: false
                            reply_to_addresses:
                              type: array
                              title: Reply To Addresses
                              description: The possible reply-to addresses. The number
                                of reply_to_addresses provided must match the number
                                of from_names. If no reply_to_addresses are provided,
                                settings.reply_to will be used.
                              items:
                                type: string
                              minItems: 0
                              uniqueItems: false
                            contents:
                              type: array
                              title: Content Descriptions
                              description: Descriptions of possible email contents.
                                To set campaign contents, make a PUT request to /campaigns/{campaign_id}/content
                                with the field 'variate_contents'.
                              readOnly: true
                              items:
                                type: string
                              minItems: 0
                              uniqueItems: false
                            combinations:
                              type: array
                              title: Combinations
                              description: Combinations of possible variables used
                                to build emails.
                              readOnly: true
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    title: ID
                                    description: Unique ID for the combination.
                                  subject_line:
                                    type: integer
                                    title: Subject Line
                                    description: The index of `variate_settings.subject_lines`
                                      used.
                                  send_time:
                                    type: integer
                                    title: Send Time
                                    description: The index of `variate_settings.send_times`
                                      used.
                                  from_name:
                                    type: integer
                                    title: From Name
                                    description: The index of `variate_settings.from_names`
                                      used.
                                  reply_to:
                                    type: integer
                                    title: Reply To
                                    description: The index of `variate_settings.reply_to_addresses`
                                      used.
                                  content_description:
                                    type: integer
                                    title: Content Description
