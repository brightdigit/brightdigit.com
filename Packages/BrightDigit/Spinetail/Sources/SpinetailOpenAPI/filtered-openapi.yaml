                              type: string
                              title: Campaign Preview Text
                              description: The preview text for the campaign.
                            title:
                              type: string
                              title: Campaign Title
                              description: The title of the campaign.
                            from_name:
                              type: string
                              title: From Name
                              description: The 'from' name on the campaign (not an
                                email address).
                            reply_to:
                              type: string
                              title: Reply To Address
                              description: The reply-to email address for the campaign.
                            use_conversation:
                              type: boolean
                              title: Conversation
                              description: Use Mailchimp Conversation feature to manage
                                out-of-office replies.
                            to_name:
                              type: string
                              title: To Name
                              description: The campaign's custom 'To' name. Typically
                                the first name [audience field](https://mailchimp.com/help/getting-started-with-merge-tags/).
