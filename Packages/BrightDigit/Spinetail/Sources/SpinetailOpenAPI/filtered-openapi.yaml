openapi: 3.1.0
info:
  title: Mailchimp Marketing API
  contact:
    name: Mailchimp API Support
    email: apihelp@mailchimp.com
  version: 3.0.55
  x-permalink: https://github.com/mailchimp/mailchimp-client-lib-codegen/blob/main/spec/marketing.json
externalDocs:
  description: Learn more with the full Mailchimp API documentation.
  url: https://mailchimp.com/developer/marketing/
servers:
- url: https://server.api.mailchimp.com/3.0
paths:
  /campaigns:
    get:
      tags:
      - campaigns
      summary: List campaigns
      description: Get all campaigns in an account.
      operationId: getCampaigns
      parameters:
      - name: fields
        in: query
        explode: false
        schema:
          type: array
          items:
            type: string
          minItems: 0
          uniqueItems: false
          x-title: Fields
        description: A comma-separated list of fields to return. Reference parameters
          of sub-objects with dot notation.
        x-title: Fields
      - name: exclude_fields
        in: query
        explode: false
        schema:
          type: array
          items:
            type: string
          minItems: 0
          uniqueItems: false
          x-title: Exclude Fields
        description: A comma-separated list of fields to exclude. Reference parameters
          of sub-objects with dot notation.
        x-title: Exclude Fields
      - name: count
        in: query
        schema:
          type: integer
          default: 10
          maximum: 1000
          x-title: Count
        description: The number of records to return. Default value is 10. Maximum
          value is 1000
        x-title: Count
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          x-title: Offset
        description: Used for [pagination](https://mailchimp.com/developer/marketing/docs/methods-parameters/#pagination),
          this it the number of records from a collection to skip. Default value is
          0.
        x-title: Offset
      - name: type
        in: query
        schema:
          type: string
          enum:
          - regular
          - plaintext
          - absplit
          - rss
          - variate
          x-title: Campaign Type
        description: The campaign type.
        x-title: Campaign Type
      - name: status
        in: query
        schema:
          type: string
          enum:
          - save
          - paused
          - schedule
          - sending
          - sent
          x-title: Status
        description: The status of the campaign.
        x-title: Status
      - name: before_send_time
        in: query
        schema:
          type: string
          format: date-time
          x-title: Before Send Time
        description: 'Restrict the response to campaigns sent before the set time.
          Uses ISO 8601 time format: 2015-10-21T15:41:36+00:00.'
        x-title: Before Send Time
      - name: since_send_time
        in: query
        schema:
          type: string
          format: date-time
          x-title: Since Send Time
        description: 'Restrict the response to campaigns sent after the set time.
          Uses ISO 8601 time format: 2015-10-21T15:41:36+00:00.'
        x-title: Since Send Time
      - name: before_create_time
        in: query
        schema:
          type: string
          format: date-time
          x-title: Before Create Time
        description: 'Restrict the response to campaigns created before the set time.
          Uses ISO 8601 time format: 2015-10-21T15:41:36+00:00.'
        x-title: Before Create Time
      - name: since_create_time
        in: query
        schema:
          type: string
          format: date-time
          x-title: Since Create Time
        description: 'Restrict the response to campaigns created after the set time.
          Uses ISO 8601 time format: 2015-10-21T15:41:36+00:00.'
        x-title: Since Create Time
      - name: list_id
        in: query
        schema:
          type: string
          x-title: List ID
        description: The unique id for the list.
        x-title: List ID
      - name: folder_id
        in: query
        schema:
          type: string
          x-title: Folder ID
        description: The unique folder id.
        x-title: Folder ID
      - name: member_id
        in: query
        schema:
          type: string
          x-title: Member ID
        description: "Retrieve campaigns sent to a particular list member. Member
          ID is The MD5 hash of the lowercase version of the list member\u2019s email
          address."
        x-title: Member ID
      - name: sort_field
        in: query
        schema:
          type: string
          enum:
          - create_time
          - send_time
          x-title: Sort By Field
        description: Returns files sorted by the specified field.
        x-title: Sort By Field
      - name: sort_dir
        in: query
        schema:
          type: string
          enum:
          - ASC
          - DESC
          x-title: Sort Direction
        description: Determines the order direction for sorted results.
        x-title: Sort Direction
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                description: An array of campaigns.
                properties:
                  campaigns:
                    type: array
                    title: Campaigns
                    description: An array of campaigns.
                    items:
                      type: object
                      title: Campaign
                      description: A summary of an individual campaign's settings
                        and content.
                      properties:
                        id:
                          type: string
                          title: Campaign ID
                          description: A string that uniquely identifies this campaign.
                          readOnly: true
                        web_id:
                          type: integer
                          title: Campaign Web ID
                          description: The ID used in the Mailchimp web application.
                            View this campaign in your Mailchimp account at `https://{dc}.admin.mailchimp.com/campaigns/show/?id={web_id}`.
                          readOnly: true
                        parent_campaign_id:
                          type: string
                          title: Parent Campaign ID
                          description: If this campaign is the child of another campaign,
                            this identifies the parent campaign. For Example, for
                            RSS or Automation children.
                          readOnly: true
                        type:
                          type: string
                          enum:
                          - regular
                          - plaintext
                          - absplit
                          - rss
                          - variate
                          title: Campaign Type
                          description: There are four types of [campaigns](https://mailchimp.com/help/getting-started-with-campaigns/)
                            you can create in Mailchimp. A/B Split campaigns have
                            been deprecated and variate campaigns should be used instead.
                        create_time:
                          type: string
                          format: date-time
                          title: Create Time
                          description: The date and time the campaign was created
                            in ISO 8601 format.
                          readOnly: true
                        archive_url:
                          type: string
                          title: Archive URL
                          description: The link to the campaign's archive version
                            in ISO 8601 format.
                          readOnly: true
                        long_archive_url:
                          type: string
                          title: Long Archive URL
                          description: The original link to the campaign's archive
                            version.
                          readOnly: true
                        status:
                          type: string
                          enum:
                          - save
                          - paused
                          - schedule
                          - sending
                          - sent
                          - canceled
                          - canceling
                          - archived
                          title: Campaign Status
                          description: The current status of the campaign.
                          readOnly: true
                        emails_sent:
                          type: integer
                          title: Emails Sent
                          description: The total number of emails sent for this campaign.
                          readOnly: true
                        send_time:
                          type: string
                          format: date-time
                          title: Send Time
                          description: The date and time a campaign was sent.
                          readOnly: true
                        content_type:
                          type: string
                          enum:
                          - template
                          - html
                          - url
                          - multichannel
                          title: Content Type
                          description: How the campaign's content is put together.
                        needs_block_refresh:
                          type: boolean
                          title: Needs Block Refresh
                          description: Determines if the campaign needs its blocks
                            refreshed by opening the web-based campaign editor. Deprecated
                            and will always return false.
                          readOnly: true
                        resendable:
                          type: boolean
                          title: Resendable
                          description: Determines if the campaign qualifies to be
                            resent to non-openers.
                          readOnly: true
                        recipients:
                          type: object
                          title: List
                          description: List settings for the campaign.
                          properties:
                            list_id:
                              type: string
                              title: List ID
                              description: The unique list id.
                            list_is_active:
                              type: boolean
                              title: List Status
                              description: The status of the list used, namely if
                                it's deleted or disabled.
                              readOnly: true
                            list_name:
                              type: string
                              title: List Name
                              description: The name of the list.
                              readOnly: true
                            segment_text:
                              type: string
                              title: Segment Text
                              description: A description of the [segment](https://mailchimp.com/help/create-and-send-to-a-segment/)
                                used for the campaign. Formatted as a string marked
                                up with HTML.
                              readOnly: true
                            recipient_count:
                              type: integer
                              title: Recipient Count
                              description: Count of the recipients on the associated
                                list. Formatted as an integer.
                              readOnly: true
                            segment_opts:
                              type: object
                              title: Segment Options
                              description: An object representing all segmentation
                                options. This object should contain a `saved_segment_id`
                                to use an existing segment, or you can create a new
                                segment by including both `match` and `conditions`
                                options.
                              properties:
                                saved_segment_id:
                                  type: integer
                                  title: Saved Segment ID
                                  description: The id for an existing saved segment.
                                prebuilt_segment_id:
                                  type: string
                                  title: Prebuilt Segment Id
                                  description: The prebuilt segment id, if a prebuilt
                                    segment has been designated for this campaign.
                                  examples:
                                  - subscribers-female
                                match:
                                  type: string
                                  enum:
                                  - any
                                  - all
                                  title: Match Type
                                  description: Segment match type.
                                conditions:
                                  type: array
                                  title: Segment Type
                                  description: Segment match conditions. There are
                                    multiple possible types, see the [condition types
                                    documentation](https://mailchimp.com/developer/marketing/docs/alternative-schemas/#segment-condition-schemas).
                                  items:
                                    type: object
                                    minProperties: 0
                                    x-oneOf:
                                    - properties:
                                        field:
                                          title: Segment Field
                                          type: string
                                          enum:
                                          - aim
                                          example: aim
                                          description: Segment by interaction with
                                            a specific campaign.
                                        condition_type:
                                          enum:
                                          - Aim
                                          type: string
                                          x-value: Aim
                                        value:
                                          title: Segment Data
                                          type: string
                                          example: any
                                          description: Either the web id value for
                                            a specific campaign or 'any' to account
                                            for subscribers who have/have not interacted
                                            with any campaigns.
                                        op:
                                          example: open
                                          type: string
                                          title: Segment Operator
                                          enum:
                                          - open
                                          - click
                                          - sent
                                          - noopen
                                          - noclick
                                          - nosent
                                          description: 'The status of the member with
                                            regard to their campaign interaction.
                                            One of the following: opened, clicked,
                                            was sent, didn''t open, didn''t click,
                                            or was not sent.'
                                      title: Aim Segment
                                      type: object
                                      description: Segment by interaction with a specific
                                        campaign.
                                    - type: object
                                      description: Segment by interaction with an
                                        Automation workflow.
                                      title: Automation Segment
                                      properties:
                                        value:
                                          type: string
                                          title: Segment Data
                                          example: '2135217'
                                          description: The web id for the automation
                                            workflow to segment against.
                                        op:
                                          type: string
                                          enum:
                                          - started
                                          - completed
                                          - not_started
                                          - not_completed
                                          description: 'The status of the member with
                                            regard to the automation workflow. One
                                            of the following: has started the workflow,
                                            has completed the workflow, has not started
                                            the workflow, or has not completed the
                                            workflow.'
                                          example: started
                                          title: Segment Operator
                                        field:
                                          example: automation
                                          description: Segment by interaction with
                                            an Automation workflow.
                                          title: Segment Field
                                          type: string
                                          enum:
                                          - automation
                                        condition_type:
                                          enum:
                                          - Automation
                                          type: string
                                          x-value: Automation
                                      required:
                                      - field
                                      - op
                                      - value
                                    - properties:
                                        field:
                                          example: poll
                                          title: Segment Field
                                          enum:
                                          - poll
                                          type: string
                                          description: Segment by poll activity.
                                        value:
                                          example: 409
                                          title: Segment Operator
                                          description: The id for the poll.
                                          type: number
                                        condition_type:
                                          enum:
                                          - CampaignPoll
                                          type: string
                                          x-value: CampaignPoll
                                        op:
                                          enum:
                                          - member
                                          - notmember
                                          type: string
                                          description: Members have/have not interacted
                                            with a specific poll in a Mailchimp email.
                                          title: Segment Operator
                                          example: member
                                      type: object
                                      title: Poll Activity Segment
                                      required:
                                      - field
                                      - op
                                      - value
                                      description: Segment by poll activity.
                                    - type: object
                                      description: Segment by interaction with a campaign
                                        via Conversations.
                                      required:
                                      - field
                                      - op
                                      - value
                                      properties:
                                        op:
                                          example: member
                                          title: Segment Operator
                                          type: string
                                          enum:
                                          - member
                                          - notmember
                                          description: 'The status of a member''s
                                            interaction with a conversation. One of
                                            the following: has replied or has not
                                            replied.'
                                        field:
                                          example: conversation
                                          title: Segment Field
                                          type: string
                                          enum:
                                          - conversation
                                          description: Segment by interaction with
                                            a campaign via Conversations.
                                        condition_type:
                                          enum:
                                          - Conversation
                                          type: string
                                          x-value: Conversation
                                        value:
                                          title: Segment Data
                                          description: The web id value for a specific
                                            campaign or 'any' to account for subscribers
                                            who have/have not interacted with any
                                            campaigns.
                                          type: string
                                          example: any
                                      title: Conversation Segment
                                    - properties:
                                        field:
                                          example: timestamp_opt
                                          title: Segment Field
                                          description: 'The type of date field to
                                            segment on: The opt-in time for a signup,
                                            the date the subscriber was last updated,
                                            or the date of their last ecomm purchase.'
                                          type: string
                                          enum:
                                          - timestamp_opt
                                          - info_changed
                                          - ecomm_date
                                        extra:
                                          example: '2015-01-30'
                                          title: Segment Extra Value
                                          description: When segmenting on 'date' or
                                            'campaign', the date for the segment formatted
                                            as YYYY-MM-DD or the web id for the campaign.
                                          type: string
                                        condition_type:
                                          enum:
                                          - Date
                                          type: string
                                          x-value: Date
                                        value:
                                          example: date
                                          type: string
                                          description: 'What type of data to segment
                                            on: a specific date, a specific campaign,
                                            or the last campaign sent.'
                                          title: Segment Data
                                        op:
                                          example: greater
                                          title: Segment Operator
                                          description: 'When the event took place:  Before,
                                            after, is a specific date, is not a specific
                                            date, is blank, or is not blank.'
                                          type: string
                                          enum:
                                          - greater
                                          - less
                                          - is
                                          - not
                                          - blank
                                          - blank_not
                                          - within
                                          - notwithin
                                      type: object
                                      description: Segment by a specific date field.
                                      required:
                                      - field
                                      - op
                                      - value
                                      title: Date Segment
                                    - type: object
                                      description: Segment by use of a particular
                                        email client.
                                      required:
                                      - field
                                      - op
                                      - value
                                      title: Email Client Segment
                                      properties:
                                        condition_type:
                                          enum:
                                          - EmailClient
                                          type: string
                                          x-value: EmailClient
                                        field:
                                          type: string
                                          enum:
                                          - email_client
                                          description: Segment by use of a particular
                                            email client.
                                          example: email_client
                                          title: Segment Field
                                        op:
                                          type: string
                                          enum:
                                          - client_is
                                          - client_not
                                          title: Segment Operator
                                          description: The operation to determine
                                            whether we select clients that match the
                                            value, or clients that do not match the
                                            value.
                                          example: client_is
                                        value:
                                          type: string
                                          description: The name of the email client.
                                          example: Gmail
                                          title: Segment Data
                                    - title: Language Segment
                                      description: Segment by language.
                                      type: object
                                      properties:
                                        op:
                                          title: Segment Operator
                                          description: Whether the member's language
                                            is or is not set to a specific language.
                                          type: string
                                          enum:
                                          - is
                                          - not
                                          example: is
                                        condition_type:
                                          enum:
                                          - Language
                                          type: string
                                          x-value: Language
                                        value:
                                          example: en
                                          description: A two-letter language identifier.
                                          type: string
                                          title: Segment Data
                                        field:
                                          title: Segment Field
                                          description: Segmenting based off of a subscriber's
                                            language.
                                          type: string
                                          enum:
                                          - language
                                          example: language
                                      required:
                                      - field
                                      - op
                                      - value
                                    - type: object
                                      description: Segment by member rating.
                                      required:
                                      - field
                                      - op
                                      - value
                                      title: Member Rating Segment
                                      properties:
                                        condition_type:
                                          enum:
                                          - MemberRating
                                          type: string
                                          x-value: MemberRating
                                        op:
                                          type: string
                                          enum:
                                          - is
                                          - not
                                          - greater
                                          - less
                                          description: Members who have have a rating
                                            that is/not exactly a given number or
                                            members who have a rating greater/less
                                            than a given number.
                                          example: greater
                                          title: Segment Operator
                                        field:
                                          type: string
                                          enum:
                                          - rating
                                          description: Segment by member rating.
                                          example: rating
                                          title: Segment Field
                                        value:
                                          type: number
                                          title: Segment Operator
                                          description: The star rating number to segment
                                            against.
                                          example: 4
                                    - title: Signup Source Segment
                                      description: Segment by signup source.
                                      type: object
                                      properties:
                                        condition_type:
                                          title: Type
                                          type: string
                                          enum:
                                          - SignupSource
                                          x-value: SignupSource
                                        op:
                                          title: Segment Operator
                                          type: string
                                          description: Whether the member's signup
                                            source was/was not a particular value.
                                          enum:
                                          - source_is
                                          - source_not
                                          example: source_is
                                        value:
                                          example: List Import
                                          description: The signup source.
                                          title: Segment Data
                                          type: string
                                        field:
                                          title: Segment Field
                                          type: string
                                          example: source
                                          enum:
                                          - source
                                      required:
                                      - field
                                      - condition_type
                                      - op
                                    - type: object
                                      description: Segment by interaction with a SurveyMonkey
                                        survey.
                                      required:
                                      - field
                                      - op
                                      - value
                                      title: Survey Monkey Segment
                                      properties:
                                        condition_type:
                                          enum:
                                          - SurveyMonkey
                                          type: string
                                          x-value: SurveyMonkey
                                        field:
                                          type: string
                                          description: Segment by interaction with
                                            a SurveyMonkey survey.
                                          example: survey_monkey
                                          enum:
                                          - survey_monkey
                                          title: Segment Field
                                        op:
                                          enum:
                                          - started
                                          - completed
                                          - not_started
                                          - not_completed
                                          title: Segment Operator
                                          description: 'The status of the member with
                                            regard to the survey.One of the following:
                                            has started the survey, has completed
                                            the survey, has not started the survey,
                                            or has not completed the survey.'
                                          type: string
                                          example: started
                                        value:
                                          type: string
                                          description: The unique ID of the survey
                                            monkey survey.
                                          example: '32179586'
                                          title: Survey ID
                                    - type: object
                                      properties:
                                        condition_type:
                                          enum:
                                          - VIP
                                          type: string
                                          x-value: VIP
                                        field:
                                          type: string
                                          example: gmonkey
                                          title: Segment Field
                                          enum:
                                          - gmonkey
                                          description: Segment by VIP status.
                                        op:
                                          type: string
                                          enum:
                                          - member
                                          - notmember
                                          example: member
                                          description: Whether the member is or is
                                            not marked as VIP.
                                          title: Segment Operator
                                      required:
                                      - field
                                      - op
                                      title: VIP Segment
                                      description: Segment by VIP status.
                                    - properties:
                                        op:
                                          example: interestcontains
                                          enum:
                                          - interestcontains
                                          - interestcontainsall
                                          - interestnotcontains
                                          type: string
                                          title: Segment Operator
                                          description: Whether the member is a part
                                            of one, all, or none of the groups.
                                        condition_type:
                                          enum:
                                          - Interests
                                          type: string
                                          x-value: Interests
                                        field:
                                          example: interests-123
                                          description: Segmenting based on interest
                                            group information. This should start with
                                            'interests-' followed by the grouping
                                            id. Ex. 'interests-123'.
                                          type: string
                                          title: Segment Field
                                        value:
                                          title: Segment Value
                                          type: array
                                          description: An array containing strings,
                                            each representing a group id.
                                          items:
                                            example:
                                            - '44401'
                                            - '44405'
                                            - '44409'
                                            type: string
                                      title: Interests Segment
                                      type: object
                                      description: Segment by an interest group merge
                                        field.
                                    - type: object
                                      properties:
                                        condition_type:
                                          enum:
                                          - EcommCategory
                                          type: string
                                          x-value: EcommCategory
                                        field:
                                          type: string
                                          example: ecomm_cat
                                          title: Segment Field
                                          enum:
                                          - ecomm_cat
                                          - ecomm_prod
                                          description: Segment by purchases in specific
                                            items or categories.
                                        value:
                                          example: Product
                                          description: The ecommerce category/item
                                            information.
                                          type: string
                                          title: Segment Data
                                        op:
                                          type: string
                                          example: is
                                          title: Segment Operator
                                          enum:
                                          - is
                                          - not
                                          - contains
                                          - notcontain
                                          - starts
                                          - ends
                                          description: A member who has purchased
                                            from a category/specific item that is/is
                                            not a specific name, where the category/item
                                            name contains/doesn't contain a specific
                                            phrase or string, or a category/item name
                                            that starts/ends with a string.
                                      title: Ecommerce Category Segment
                                      description: Segment by purchases in specific
                                        items or categories.
                                    - type: object
                                      description: Segment by average spent total,
                                        number of orders, total number of products
                                        purchased, or average number of products per
                                        order.
                                      required:
                                      - field
                                      - op
                                      - value
                                      title: Ecommerce Number Segment
                                      properties:
                                        condition_type:
                                          enum:
                                          - EcommNumber
                                          x-value: EcommNumber
                                          type: string
                                        field:
                                          type: string
                                          enum:
                                          - ecomm_spent_avg
                                          - ecomm_orders
                                          - ecomm_prod_all
                                          - ecomm_avg_ord
                                          example: ecomm_orders
                                          description: Segment by average spent total,
                                            number of orders, total number of products
                                            purchased, or average number of products
                                            per order.
                                          title: Segment Field
                                        op:
                                          enum:
                                          - is
                                          - not
                                          - greater
                                          - less
                                          example: greater
                                          description: Members who have spent exactly,
                                            have not spent exactly, spent more, or
                                            spent less than the segment value.
                                          type: string
                                          title: Segment Operator
                                        value:
                                          type: number
                                          description: Members who have spent exactly,
                                            have not spent exactly, spent more, or
                                            spent less than this amount.
                                          example: 42
                                          title: Segment Operator
                                    - title: Ecommerce Purchased Segment
                                      type: object
                                      properties:
                                        field:
                                          enum:
                                          - ecomm_purchased
                                          title: Segment Field
                                          type: string
                                          example: ecomm_purchased
                                          description: Segment by whether someone
                                            has purchased anything.
                                        op:
                                          type: string
                                          description: Members who have have ('member')
                                            or have not ('notmember') purchased.
                                          example: member
                                          enum:
                                          - member
                                          - notmember
                                          title: Segment Operator
                                        condition_type:
                                          enum:
                                          - EcommPurchased
                                          type: string
                                          x-value: EcommPurchased
                                      description: Segment by whether someone has
                                        purchased anything.
                                    - description: Segment by amount spent on a single
                                        order or across all orders.
                                      title: Ecommerce Spent Segment
