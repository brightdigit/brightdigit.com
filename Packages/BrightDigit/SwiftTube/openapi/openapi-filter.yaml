# swift-openapi-generator filter configuration.
#
# Reduces the full YouTube Data API v3 document (openapi/youtube-openapi.json,
# ~80 operations) down to only the operations the brightdigit.com podcast
# importer actually consumes. `swift-openapi-generator filter` automatically
# pulls in every schema/parameter those operations depend on.
generate: []
filter:
  operations:
    - listPlaylistItems  # playlistItems.list — paged video ids for a playlist
    - listVideos         # videos.list — batched video detail lookup
