[settings]
# Enable experimental features (required for the spm backend)
experimental = true

[tools]
# Swift development tools (managed via mise)
# 603.x aligns swift-format (and its swift-syntax) with the Swift 6.3 lint
# toolchain (the swift:6.3-noble container). Bump to 604.x when lint + builds
# move to Swift 6.4.
"spm:swiftlang/swift-format" = "603.0.0-prerelease-2026-02-09"
"aqua:realm/SwiftLint" = "0.63.2"
"spm:peripheryapp/periphery" = "3.7.4"

[tasks]
swift-format = "swift-format"
swiftlint = "swiftlint"
periphery = "periphery"
