name: Test

on: [push]

env:
  PUBLISH_BRANCH: brightdigit-com-260406

jobs:
  build:
    runs-on: macOS-latest

    steps:
      - uses: actions/checkout@v1
      - name: Ensure remote deps
        shell: bash
        run: ./Scripts/ensure-remote-deps.sh
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v
