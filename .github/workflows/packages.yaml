name: Packages CI

# CI for the vendored BrightDigit packages, following the BrightDigit CI
# template (MistKit/SundialKit/SyndiKit workflows) with an extra `package`
# matrix dimension. In the monorepo checkout every sibling already sits at its
# relative-path location (../../Publish/*, ../Contribute, ...), so each
# package resolves in-place with no dependency reconstruction.
on:
  push:
    branches: [main]
    paths:
      - 'Packages/BrightDigit/**'
      - '.github/workflows/packages.yaml'
  pull_request:
    paths:
      - 'Packages/BrightDigit/**'
      - '.github/workflows/packages.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  configure:
    name: Configure Matrix
    runs-on: ubuntu-latest
    outputs:
      full-matrix: ${{ steps.check.outputs.full }}
      packages: ${{ steps.matrix.outputs.packages }}
      cross-packages: ${{ steps.matrix.outputs.cross-packages }}
      ubuntu-os: ${{ steps.matrix.outputs.ubuntu-os }}
      ubuntu-swift: ${{ steps.matrix.outputs.ubuntu-swift }}
      ubuntu-type: ${{ steps.matrix.outputs.ubuntu-type }}
    steps:
      - id: check
        name: Determine matrix scope
        run: |
          FULL=false
          REF="${{ github.ref }}"
          EVENT="${{ github.event_name }}"
          BASE_REF="${{ github.base_ref }}"

          # Full matrix on main
          if [[ "$REF" == "refs/heads/main" ]]; then
            FULL=true
          # Full matrix on semver branches (v1.0.0, 1.2.3-alpha.1, etc.)
          elif [[ "$REF" =~ ^refs/heads/v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            FULL=true
          # Full matrix on manual runs
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            FULL=true
          # Full matrix on PRs targeting main or semver branches
          elif [[ "$EVENT" == "pull_request" ]]; then
            if [[ "$BASE_REF" == "main" || "$BASE_REF" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              FULL=true
            fi
          fi

          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "Full matrix: $FULL (ref=$REF, event=$EVENT, base_ref=$BASE_REF)"

      - id: matrix
        name: Build matrix values
        # The package lists live here and only here. `packages` is every
        # vendored package; `cross-packages` is the pure-Swift subset that can
        # target Windows/Android/wasm. The Publish-dependent plugins (Files,
        # ShellOut in their dependency chains) are macOS + Linux only.
        # The three swift-openapi-generator clients (Spinetail, ButtondownKit,
        # SwiftTube) each ship committed generated code + Scripts/lint.sh +
        # .mise.toml, so they build, test, and lint standalone. Spinetail and
        # ButtondownKit (#83) declare swift-tools-version 6.4 / Swift 6 mode and
        # build on macOS (Xcode 26.4), lint on the 6.4 nightly, and build on the
        # Ubuntu (nightly-6.4) leg. SwiftTube (swift-openapi-generator YouTube
        # client) also gets the macOS build + STRICT lint, but is excluded from
        # build-ubuntu below because that job pins `swift:6.3-*`, which cannot
        # parse its swift-tools-version:6.4 manifest. All three stay out of
        # cross-packages because their swift-openapi-urlsession / Foundation
        # networking stack is unavailable on the wasm/Windows/Android SDKs.
        run: |
          {
            echo 'packages=[{"name":"SyndiKit","path":"Packages/BrightDigit/SyndiKit"},{"name":"Contribute","path":"Packages/BrightDigit/Contribute"},{"name":"ContributeWordPress","path":"Packages/BrightDigit/ContributeWordPress"},{"name":"TransistorPublishPlugin","path":"Packages/BrightDigit/TransistorPublishPlugin"},{"name":"NPMPublishPlugin","path":"Packages/BrightDigit/NPMPublishPlugin"},{"name":"YoutubePublishPlugin","path":"Packages/BrightDigit/YoutubePublishPlugin"},{"name":"Spinetail","path":"Packages/BrightDigit/Spinetail"},{"name":"ButtondownKit","path":"Packages/BrightDigit/ButtondownKit"},{"name":"SwiftTube","path":"Packages/BrightDigit/SwiftTube"}]'
            echo 'cross-packages=[{"name":"SyndiKit","path":"Packages/BrightDigit/SyndiKit"},{"name":"Contribute","path":"Packages/BrightDigit/Contribute"},{"name":"ContributeWordPress","path":"Packages/BrightDigit/ContributeWordPress"}]'
          } >> "$GITHUB_OUTPUT"

          if [[ "${{ steps.check.outputs.full }}" == "true" ]]; then
            {
              echo 'ubuntu-os=["noble"]'
              echo 'ubuntu-swift=[{"version":"6.4"}]'
              echo 'ubuntu-type=[""]'  # wasm/wasm-embedded disabled on phase-04-openapi
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'ubuntu-os=["noble"]'
              echo 'ubuntu-swift=[{"version":"6.4"}]'
              echo 'ubuntu-type=[""]'
            } >> "$GITHUB_OUTPUT"
          fi

  build-ubuntu:
    name: Build ${{ matrix.package.name }} on Ubuntu
    needs: configure
    runs-on: ubuntu-latest
    container: swiftlang/swift:nightly-6.4.x-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.configure.outputs.packages) }}
        os: ${{ fromJSON(needs.configure.outputs.ubuntu-os) }}
        swift: ${{ fromJSON(needs.configure.outputs.ubuntu-swift) }}
        type: ${{ fromJSON(needs.configure.outputs.ubuntu-type) }}
        exclude:
          # SwiftTube declares swift-tools-version:6.4 (Swift 6 language mode);
          # the swift:6.3-* container here cannot parse that manifest. It is
          # still built on macOS (Swift 6.4 via Xcode) and STRICT-linted on the
          # nightly-6.4 container by the `lint` job below.
          - package: { name: SwiftTube }
          # Publish-dependent plugins are macOS + Linux only (Files/ShellOut)
          - package: { name: TransistorPublishPlugin }
            type: "wasm"
          - package: { name: TransistorPublishPlugin }
            type: "wasm-embedded"
          - package: { name: NPMPublishPlugin }
            type: "wasm"
          - package: { name: NPMPublishPlugin }
            type: "wasm-embedded"
          - package: { name: YoutubePublishPlugin }
            type: "wasm"
          - package: { name: YoutubePublishPlugin }
            type: "wasm-embedded"
          # Contribute/ContributeWordPress depend on Yams, which fails on the
          # Musl/wasm SDK with Swift 6.3 ('DBL_DECIMAL_DIG' not in scope; fixed on
          # Yams main but unreleased as of 6.2.2). wasm-embedded also lacks
          # Foundation, which both packages require. Revisit when Yams ships the
          # Musl fix. They DO build on Windows/Android (Yams 6 + Foundation shims).
          - package: { name: Contribute }
            type: "wasm"
          - package: { name: Contribute }
            type: "wasm-embedded"
          - package: { name: ContributeWordPress }
            type: "wasm"
          - package: { name: ContributeWordPress }
            type: "wasm-embedded"
    steps:
      - uses: actions/checkout@v6
      - uses: brightdigit/swift-build@v1
        id: build
        with:
          working-directory: ${{ matrix.package.path }}
          type: ${{ matrix.type }}
      - name: Install curl (required by Codecov uploader)
        if: steps.build.outputs.contains-code-coverage == 'true'
        run: |
          if ! command -v curl &> /dev/null; then
            apt-get update -q
            apt-get install -y --no-install-recommends curl ca-certificates
          fi
      - uses: sersoft-gmbh/swift-coverage-action@v5
        if: steps.build.outputs.contains-code-coverage == 'true'
        id: coverage-files
        with:
          search-paths: ${{ matrix.package.path }}/.build
          # Swift 6.4 on Linux emits profdata that swift-coverage-action@v5 cannot
          # convert (new .build/out/Products layout); macOS converts fine. Keep
          # Linux coverage best-effort so a conversion miss doesn't fail the build.
          fail-on-empty-output: false
      - name: Upload coverage to Codecov
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: codecov/codecov-action@v7
        with:
          # fail_ci_if_error stays false until CODECOV_TOKEN is added to this
          # repo's secrets (it is not set today).
          fail_ci_if_error: false
          flags: ${{ matrix.package.name }},${{ matrix.os }},swift-${{ matrix.swift.version }}
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ join(fromJSON(steps.coverage-files.outputs.files), ',') }}

  # NOTE: Windows and Android build jobs are disabled on phase-04-openapi.
  # The OpenAPI integration branch targets Ubuntu (nightly Swift 6.4) + macOS
  # only; the cross-platform legs (and wasm) are out of scope here. Restore the
  # build-windows / build-android jobs from git history (or main's packages.yaml)
  # when reintroducing cross-platform CI.

  # Minimal macOS build — always runs (SPM, current Xcode)
  build-macos:
    name: Build ${{ matrix.package.name }} on macOS
    needs: configure
    runs-on: [self-hosted, macOS]
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.configure.outputs.packages) }}
    steps:
      - uses: actions/checkout@v6
      - name: Build and Test
        id: build
        uses: brightdigit/swift-build@v1
        with:
          working-directory: ${{ matrix.package.path }}
          xcode: "/Applications/Xcode-beta.app"
      - name: Process Coverage
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: sersoft-gmbh/swift-coverage-action@v5
        with:
          search-paths: ${{ matrix.package.path }}/.build
      - name: Upload Coverage
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.package.name }},spm,macos

  # Full Apple-platform builds — only SyndiKit declares iOS/watchOS/tvOS
  build-macos-platforms:
    name: Build SyndiKit on macOS (Platforms)
    needs: configure
    if: ${{ needs.configure.outputs.full-matrix == 'true' }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - type: macos
            runs-on: macos-26
            xcode: "/Applications/Xcode_26.4.app"

          # iOS
          - type: ios
            runs-on: macos-26
            xcode: "/Applications/Xcode_26.4.app"
            deviceName: "iPhone 17 Pro"
            osVersion: "26.4.1"
            download-platform: true

          # watchOS
          - type: watchos
            runs-on: macos-26
            xcode: "/Applications/Xcode_26.4.app"
            deviceName: "Apple Watch Ultra 3 (49mm)"
            osVersion: "26.4"
            download-platform: true

          # tvOS
          - type: tvos
            runs-on: macos-26
            xcode: "/Applications/Xcode_26.4.app"
            deviceName: "Apple TV"
            osVersion: "26.4"
            download-platform: true
    steps:
      - uses: actions/checkout@v6
      - name: Build and Test
        id: build
        uses: brightdigit/swift-build@v1
        with:
          working-directory: Packages/BrightDigit/SyndiKit
          type: ${{ matrix.type }}
          xcode: ${{ matrix.xcode }}
          deviceName: ${{ matrix.deviceName }}
          osVersion: ${{ matrix.osVersion }}
          download-platform: ${{ matrix.download-platform }}
      - name: Process Coverage
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: sersoft-gmbh/swift-coverage-action@v5
        with:
          search-paths: Packages/BrightDigit/SyndiKit/.build
      - name: Upload Coverage
        if: steps.build.outputs.contains-code-coverage == 'true'
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: SyndiKit,${{ format('{0}{1}', matrix.type, matrix.osVersion) }}

  lint:
    name: Lint ${{ matrix.package.name }}
    # Full-only build jobs are skipped on quick runs; !failure() lets this job
    # proceed past skipped (not failed) dependencies. lint.sh is non-mutating
    # under CI ($CI is set) and builds tests itself, resolving siblings
    # in-place.
    if: ${{ !cancelled() && !failure() }}
    needs: [configure, build-ubuntu, build-macos, build-macos-platforms]
    runs-on: ubuntu-latest
    # Lint on the Swift 6.4 nightly (the project's target toolchain) so swift-format
    # 604 builds against a matching swift-syntax. On the 6.3 image the 604 tool
    # crashed in its FileIterator. The bare nightly snapshot lacks curl, which
    # mise-action needs to bootstrap mise, so install it first.
    container: swiftlang/swift:nightly-6.4.x-noble
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.configure.outputs.packages) }}
    steps:
      - name: Install curl (required by mise-action)
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends curl ca-certificates
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        env:
          # Raise the default 30s download timeout: GitHub throttles the SwiftLint
          # release zip when many matrix lint jobs fetch it in parallel. Authenticate
          # via the token to lift the unauthenticated rate limit.
          MISE_HTTP_TIMEOUT: 300s
          MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          working_directory: ${{ matrix.package.path }}
          cache: true
      - name: Lint
        working-directory: ${{ matrix.package.path }}
        run: ./Scripts/lint.sh
        env:
          LINT_MODE: STRICT
